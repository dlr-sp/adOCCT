# This workflow builds and tests adOCCT on Ubuntu with GCC

name: Build and Test adOCCT

on:
  pull_request:
    branches:
      - '**'
  push:
    branches:
      - 'ad/master'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-linux-gcc:
    name: Prepare and Build on Ubuntu with GCC (x64)
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        AD_MODE: [ "adolc-forward", "adolc-reverse", "codipack-forward", "codipack-reverse" ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y tcl-dev tk-dev cmake make libx11-dev libglu1-mesa-dev tcllib tcl-thread tcl libfreeimage-dev libfreetype-dev

      - name: Clone and install ADOL-C
        run: |
          mkdir -p _deps
          git clone --branch releases/2.7.2 --depth 1 https://github.com/coin-or/ADOL-C.git _deps/adolc-src
          cd _deps/adolc-src
          autoreconf -fi
          ./configure --enable-atrig-erf --prefix=$GITHUB_WORKSPACE/_deps/adolc-install
          make -j$(nproc)
          make install

      - name: Clone and install CoDiPack
        run: |
          mkdir -p _deps
          git clone --branch v3.1.3 --depth 1 https://github.com/SciCompKL/CoDiPack.git _deps/codipack-src
          cd _deps/codipack-src
          cmake -B build -DCMAKE_INSTALL_PREFIX=$GITHUB_WORKSPACE/_deps/codipack-install
          cmake --install build

      - name: Configure CMake
        run: |
          if [ "${{ matrix.AD_MODE }}" == "adolc-forward" ]; then
            cmake -B build \
              -DCMAKE_BUILD_TYPE=Release \
              -DBUILD_CPP_STANDARD=C++17 \
              -DUSE_ADOLC=ON \
              -DBUILD_AD_TESTS=ON \
              -D3RDPARTY_ADOLC_DIR=$GITHUB_WORKSPACE/_deps/adolc-install
          elif [ "${{ matrix.AD_MODE }}" == "adolc-reverse" ]; then
            cmake -B build \
              -DCMAKE_BUILD_TYPE=Release \
              -DBUILD_CPP_STANDARD=C++17 \
              -DUSE_ADOLC=ON \
              -DBUILD_AD_TESTS=ON \
              -D3RDPARTY_ADOLC_DIR=$GITHUB_WORKSPACE/_deps/adolc-install \
              -DADOLC_REVERSE_MODE=ON
          elif [ "${{ matrix.AD_MODE }}" == "codipack-forward" ]; then
            cmake -B build \
              -DCMAKE_BUILD_TYPE=Release \
              -DBUILD_CPP_STANDARD=C++17 \
              -DUSE_CODIPACK=ON \
              -DBUILD_AD_TESTS=ON \
              -DCoDiPack_DIR=$GITHUB_WORKSPACE/_deps/codipack-install/share/CoDiPack/cmake
          elif [ "${{ matrix.AD_MODE }}" == "codipack-reverse" ]; then
            cmake -B build \
              -DCMAKE_BUILD_TYPE=Release \
              -DBUILD_CPP_STANDARD=C++17 \
              -DUSE_CODIPACK=ON \
              -DBUILD_AD_TESTS=ON \
              -DCoDiPack_DIR=$GITHUB_WORKSPACE/_deps/codipack-install/share/CoDiPack/cmake \
              -DCODIPACK_REVERSE_MODE=ON
          fi

      - name: Build
        run: |
          cmake --build build -j$(nproc)

      - name: Run tests
        working-directory: build
        run: |
          ctest --output-on-failure --output-junit test-results.xml

      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.AD_MODE }}
          path: build/test-results.xml
          retention-days: 7